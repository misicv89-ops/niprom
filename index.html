document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-12px rgba(20,65,232,0.9)\" style-hover=\"background:#fff;color:#0A1533\">Prijavi se za upis<\u002Fa>\n          <a href=\"#cenovnik\" style=\"border:1px solid rgba(255,255,255,0.28);color:#fff;padding:16px 28px;border-radius:999px;font-weight:600;font-size:16px\" style-hover=\"background:rgba(255,255,255,0.1);color:#fff\">Pogledaj cene<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative;animation:nipromRise .9s ease both\">\n        <div style=\"aspect-ratio:4/3;border-radius:22px;border:1px solid rgba(255,255,255,0.18);overflow:hidden\">\n          <img src=\"a3dfd16d-658e-498a-8d5a-799004e64dc1\" alt=\"Instruktor i polaznica tokom časa vožnje\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n        <\u002Fdiv>\n        <div data-mrow=\"\" style=\"position:absolute;left:-14px;bottom:-26px;background:#fff;color:#0A1533;border-radius:16px;padding:16px 20px;box-shadow:0 24px 50px -20px rgba(10,21,51,0.6);display:flex;gap:22px\">\n          <div>\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;line-height:1\">30+<\u002Fdiv>\n            <div style=\"font-size:12px;color:#5C6A8C;letter-spacing:0.04em\">godina rada<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:1px;background:#E3E8F5\"><\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;line-height:1\">B &amp; A<\u002Fdiv>\n            <div style=\"font-size:12px;color:#5C6A8C;letter-spacing:0.04em\">kategorije<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"prednosti\" style=\"border-bottom:1px solid #E3E8F5;background:#fff\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:26px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px\">\n      <div data-mrow=\"\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;color:#43506F;text-align:center\"><span style=\"width:9px;height:9px;flex:none;border-radius:99px;background:#1441E8\"><\u002Fspan>Teorija u učionici<\u002Fdiv>\n      <div data-mrow=\"\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;color:#43506F;text-align:center\"><span style=\"width:9px;height:9px;flex:none;border-radius:99px;background:#1441E8\"><\u002Fspan>Plaćanje na rate i preko administrativne zabrane<\u002Fdiv>\n      <div data-mrow=\"\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;color:#43506F;text-align:center\"><span style=\"width:9px;height:9px;flex:none;border-radius:99px;background:#1441E8\"><\u002Fspan>Novi vozni park<\u002Fdiv>\n      <div data-mrow=\"\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;color:#43506F;text-align:center\"><span style=\"width:9px;height:9px;flex:none;border-radius:99px;background:#1441E8\"><\u002Fspan>Niš, Pirot, Prokuplje, Bela Palanka<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"o-nama\" style=\"max-width:1200px;margin:0 auto;padding:96px 24px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:56px;align-items:stretch\">\n      <div>\n        <div style=\"font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#1441E8\">O nama<\u002Fdiv>\n        <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(32px,4vw,46px);line-height:1.05;letter-spacing:-0.03em;margin:16px 0 0;text-wrap:balance\">Škola u kojoj se vožnja uči mirno i temeljno.<\u002Fh2>\n        <p style=\"font-size:17px;line-height:1.7;color:#43506F;margin:20px 0 0;text-wrap:pretty\">\n          Niprom je auto škola iz Niša sa dugogodišnjim iskustvom u obuci vozača. Radimo u malim grupama, pratimo napredak svakog polaznika i prilagođavamo tempo — bez žurbe i pritiska. Naši instruktori su licencirani i tu su da te nauče da voziš sigurno, ne samo da položiš.\n        <\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin-top:34px\">\n          <div style=\"border:1px solid #E3E8F5;border-radius:16px;padding:18px;background:#fff\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;color:#1441E8;line-height:1\">1.800<\u002Fdiv>\n            <div style=\"font-size:13px;color:#5C6A8C;margin-top:4px\">položenih polaznika<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #E3E8F5;border-radius:16px;padding:18px;background:#fff\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;color:#1441E8;line-height:1\">3<\u002Fdiv>\n            <div style=\"font-size:13px;color:#5C6A8C;margin-top:4px\">licenciranih instruktora<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #E3E8F5;border-radius:16px;padding:18px;background:#fff\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;color:#1441E8;line-height:1\">7/7<\u002Fdiv>\n            <div style=\"font-size:13px;color:#5C6A8C;margin-top:4px\">termini za vožnju<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"align-self:stretch;min-height:100%;border-radius:22px;border:1px solid #E3E8F5;overflow:hidden;background:#EEF2FD;line-height:0\">\n        <img src=\"eb2eabca-7372-48cc-8931-aee08c6d11f2\" alt=\"Teorijska nastava u učionici auto škole Niprom\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"kategorije\" style=\"background:#fff;border-block:1px solid #E3E8F5\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:96px 24px\">\n      <div style=\"font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#1441E8\">Kategorije<\u002Fdiv>\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(32px,4vw,46px);line-height:1.05;letter-spacing:-0.03em;margin:16px 0 46px;max-width:640px;text-wrap:balance\">Obučavamo za B i A kategoriju.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px\">\n        <div style=\"border:1px solid #E3E8F5;border-radius:22px;padding:32px;background:#FBFCFE;display:flex;flex-direction:column;gap:16px\" style-hover=\"border-color:#1441E8;transform:translateY(-4px)\">\n          <div data-mrow=\"\" style=\"display:flex;align-items:center;justify-content:space-between\">\n            <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;color:#1441E8;line-height:1\">B<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#5C6A8C;border:1px solid #E3E8F5;border-radius:999px;padding:6px 12px\">od 16,5 godina<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:0;letter-spacing:-0.02em\">Putnička vozila<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.65;color:#43506F\">Kompletna obuka: teorijska nastava, 40 časova praktične vožnje, priprema za poligon i gradsku vožnju, kao i za oba dela ispita.<\u002Fp>\n          <div data-mrow=\"\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:4px\">\n            <span style=\"font-size:13px;background:#EEF2FD;color:#1441E8;border-radius:999px;padding:7px 13px;font-weight:500\">40 časova vožnje<\u002Fspan>\n            <span style=\"font-size:13px;background:#EEF2FD;color:#1441E8;border-radius:999px;padding:7px 13px;font-weight:500\">Prva pomoć<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E3E8F5;border-radius:22px;padding:32px;background:#FBFCFE;display:flex;flex-direction:column;gap:16px\" style-hover=\"border-color:#1441E8;transform:translateY(-4px)\">\n          <div data-mrow=\"\" style=\"display:flex;align-items:center;justify-content:space-between\">\n            <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;color:#1441E8;line-height:1\">A<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#5C6A8C;border:1px solid #E3E8F5;border-radius:999px;padding:6px 12px\">A1 · A2 · A<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:0;letter-spacing:-0.02em\">Motocikli<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.65;color:#43506F\">Obuka na motociklu prilagođena podkategoriji. Poligonske vežbe u zaštićenim uslovima, zatim vožnja u saobraćaju uz instruktora.<\u002Fp>\n          <div data-mrow=\"\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:4px\">\n            <span style=\"font-size:13px;background:#EEF2FD;color:#1441E8;border-radius:999px;padding:7px 13px;font-weight:500\">Poligon<\u002Fspan>\n            <span style=\"font-size:13px;background:#EEF2FD;color:#1441E8;border-radius:999px;padding:7px 13px;font-weight:500\">Oprema obezbeđena<\u002Fspan>\n            <span style=\"font-size:13px;background:#EEF2FD;color:#1441E8;border-radius:999px;padding:7px 13px;font-weight:500\">Popust uz B<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"lokacije\" style=\"max-width:1200px;margin:0 auto;padding:96px 24px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:end;justify-content:space-between;margin-bottom:46px\" data-mrow=\"\">\n      <div>\n        <div style=\"font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#1441E8\">Lokacije<\u002Fdiv>\n        <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(32px,4vw,46px);line-height:1.05;letter-spacing:-0.03em;margin:16px 0 0;max-width:620px;text-wrap:balance\">Niš, Pirot, Prokuplje i Bela Palanka.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:15px;line-height:1.6;color:#5C6A8C;max-width:360px;text-wrap:pretty\">Ne moraš da putuješ do Niša da bi vozio sa nama. Kroz partnerske škole u jugoistočnoj Srbiji obuka se odvija po istom programu i sa istim standardom — upišeš se u svom gradu, a teoriju i vožnju slušaš lokalno.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px\">\n      <div style=\"border:1px solid #1441E8;border-radius:22px;padding:30px;background:#fff;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:10px\" data-mrow=\"\">\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:#1441E8;color:#fff;border-radius:999px;padding:5px 11px\">Centrala<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;margin:0;letter-spacing:-0.02em\">Niš — Niprom<\u002Fh3>\n        <div style=\"font-size:15px;color:#5C6A8C\">Sinđelićev trg 4, 18000 Niš<\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#43506F\">Sedište škole: učionica za teorijsku nastavu, kancelarija za upis i vozni park za kategorije B i A.<\u002Fp>\n        <div style=\"display:grid;gap:4px;margin-top:auto;padding-top:12px\">\n          <a href=\"tel:018527792\" style=\"font-size:15px;font-weight:600\">018 / 527-792<\u002Fa>\n          <a href=\"tel:018527793\" style=\"font-size:15px;font-weight:600\">018 / 527-793<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #E3E8F5;border-radius:22px;padding:30px;background:#fff;display:flex;flex-direction:column;gap:12px\" style-hover=\"border-color:#1441E8;transform:translateY(-4px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\" data-mrow=\"\">\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:#EEF2FD;color:#1441E8;border-radius:999px;padding:5px 11px\">Pirot<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;margin:0;letter-spacing:-0.02em\">DOO COV Pirot<\u002Fh3>\n        <div style=\"font-size:15px;color:#5C6A8C\">Obuka i upis u Pirotu<\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#43506F\">Polaznici iz Pirota i okoline prijavljuju se direktno u gradu — teorija i časovi vožnje se održavaju lokalno.<\u002Fp>\n        <div style=\"display:grid;gap:4px;margin-top:auto;padding-top:12px\">\n          <a href=\"tel:010345325\" style=\"font-size:15px;font-weight:600\">010 / 345-325<\u002Fa>\n          <a href=\"tel:066245325\" style=\"font-size:15px;font-weight:600\">066 / 245-325<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #E3E8F5;border-radius:22px;padding:30px;background:#fff;display:flex;flex-direction:column;gap:12px\" style-hover=\"border-color:#1441E8;transform:translateY(-4px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\" data-mrow=\"\">\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:#EEF2FD;color:#1441E8;border-radius:999px;padding:5px 11px\">Prokuplje<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;margin:0;letter-spacing:-0.02em\">DOO LUX Prokuplje<\u002Fh3>\n        <div style=\"font-size:15px;color:#5C6A8C\">Obuka i upis u Prokuplju<\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#43506F\">Toplički okrug pokrivamo iz Prokuplja: isti program obuke, termini vožnje prilagođeni školi i poslu.<\u002Fp>\n        <div style=\"display:grid;gap:4px;margin-top:auto;padding-top:12px\">\n          <a href=\"tel:027334422\" style=\"font-size:15px;font-weight:600\">027 / 33-44-22<\u002Fa>\n          <a href=\"tel:066234422\" style=\"font-size:15px;font-weight:600\">066 / 23-44-22<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #E3E8F5;border-radius:22px;padding:30px;background:#fff;display:flex;flex-direction:column;gap:12px\" style-hover=\"border-color:#1441E8;transform:translateY(-4px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\" data-mrow=\"\">\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:#EEF2FD;color:#1441E8;border-radius:999px;padding:5px 11px\">Bela Palanka<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;margin:0;letter-spacing:-0.02em\">Bela Palanka<\u002Fh3>\n        <div style=\"font-size:15px;color:#5C6A8C\">Upis i informacije<\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#43506F\">Za polaznike iz Bele Palanke organizujemo obuku bez putovanja u veći grad — pozovi za slobodne termine.<\u002Fp>\n        <div style=\"display:grid;gap:4px;margin-top:auto;padding-top:12px\">\n          <a href=\"tel:0644857210\" style=\"font-size:15px;font-weight:600\">064 / 485-72-10<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"cenovnik\" style=\"max-width:1200px;margin:0 auto;padding:96px 24px;border-top:1px solid #E3E8F5\">\n    <div data-mrow=\"\" style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:end;justify-content:space-between;margin-bottom:44px\">\n      <div>\n        <div style=\"font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#1441E8\">Cenovnik<\u002Fdiv>\n        <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(32px,4vw,46px);line-height:1.05;letter-spacing:-0.03em;margin:16px 0 0;text-wrap:balance\">Jasne cene, bez skrivenih troškova.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:15px;color:#5C6A8C;max-width:340px\">Moguće plaćanje na rate i putem administrativne zabrane. Za tačnu ponudu za A kategoriju pozovi nas ili pošalji upit.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px\">\n      <div style=\"border-radius:22px;padding:34px;background:#0A1533;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"position:absolute;inset:0;background:radial-gradient(500px 300px at 90% 0%, rgba(20,65,232,0.6), transparent 60%)\"><\u002Fdiv>\n        <div style=\"position:relative\">\n          <div style=\"display:inline-block;background:#1441E8;color:#fff;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;border-radius:999px;padding:6px 12px\">Najtraženije<\u002Fdiv>\n          <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:18px 0 0\">B kategorija — kompletna obuka<\u002Fh3>\n          <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:14px\">\n            <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:48px;letter-spacing:-0.03em\">{{ priceB }}<\u002Fspan>\n            <span style=\"font-size:16px;color:#A9BCFF\">RSD<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.65;color:#C3CCE6;margin:14px 0 0\">Teorijska nastava, 40 časova praktične vožnje i prijave za ispite. Plaćanje u više rata.<\u002Fp>\n          <a href=\"#kontakt\" style=\"display:inline-block;margin-top:24px;background:#fff;color:#0A1533;padding:14px 24px;border-radius:999px;font-weight:600;font-size:15px\" style-hover=\"background:#1441E8;color:#fff\">Prijavi se<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E3E8F5;border-radius:22px;padding:34px;background:#fff;display:flex;flex-direction:column;gap:16px\">\n        <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin:0\">Pojedinačne stavke<\u002Fh3>\n        <div data-mrow=\"\" style=\"display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #EEF2FD\">\n          <span style=\"font-size:16px;color:#43506F\">Dodatni čas vožnje<\u002Fspan>\n          <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px\">1.800 RSD<\u002Fspan>\n        <\u002Fdiv>\n        <div data-mrow=\"\" style=\"display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #EEF2FD\">\n          <span style=\"font-size:16px;color:#43506F\">A kategorija (A1 / A2 / A)<\u002Fspan>\n          <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px\">na upit<\u002Fspan>\n        <\u002Fdiv>\n        <div data-mrow=\"\" style=\"display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #EEF2FD\">\n          <span style=\"font-size:16px;color:#43506F\">Obuka uz sopstveno vozilo<\u002Fspan>\n          <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px\">na upit<\u002Fspan>\n        <\u002Fdiv>\n        <div data-mrow=\"\" style=\"display:flex;justify-content:space-between;gap:16px;padding:14px 0\">\n          <span style=\"font-size:16px;color:#43506F\">Popust za grupne upise<\u002Fspan>\n          <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px\">da<\u002Fspan>\n        <\u002Fdiv>\n        <a href=\"tel:018527793\" style=\"margin-top:auto;font-weight:600;font-size:15px\">Pozovi centralu 018 / 527-793 →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"kontakt\" style=\"background:#fff;border-top:1px solid #E3E8F5\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:96px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;align-items:stretch\">\n      <div>\n        <div style=\"font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#1441E8\">Kontakt<\u002Fdiv>\n        <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(32px,4vw,46px);line-height:1.05;letter-spacing:-0.03em;margin:16px 0 0;text-wrap:balance\">Javi se — upis traje 5 minuta.<\u002Fh2>\n        <div style=\"display:grid;gap:18px;margin-top:32px\">\n          <div>\n            <div style=\"font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#8A95B0;font-weight:600\">Adresa<\u002Fdiv>\n            <div style=\"font-size:17px;margin-top:5px\">Sinđelićev trg 4, 18000 Niš<\u002Fdiv>\n            <a href=\"https://www.google.com/maps/place/Niprom/@43.3213799,21.8932534,15.29z/data=!4m6!3m5!1s0x4755b1954ce6167d:0x3043773a05800775!8m2!3d43.3210036!4d21.8998242\" target=\"_blank\" rel=\"noopener\" style=\"font-size:15px;font-weight:600;display:inline-block;margin-top:6px\">Otvori u Google mapama →<\u002Fa>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#8A95B0;font-weight:600\">Telefon<\u002Fdiv>\n            <div style=\"font-size:17px;margin-top:5px;display:grid;gap:3px\">\n              <a href=\"tel:018527792\">tel./fax: 018 / 527-792<\u002Fa>\n              <a href=\"tel:018527793\">centrala: 018 / 527-793<\u002Fa>\n              <a href=\"tel:018252490\">direktor: 018 / 252-490<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#8A95B0;font-weight:600\">Email<\u002Fdiv>\n            <div style=\"font-size:17px;margin-top:5px\"><a href=\"mailto:niprom.nis@gmail.com\">niprom.nis@gmail.com<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:32px;border-radius:18px;overflow:hidden;border:1px solid #E3E8F5;height:280px\">\n          <iframe title=\"Mapa — Auto škola Niprom, Niš\" src=\"https://www.google.com/maps?q=Niprom%20auto%20skola%2C%20Sin%C4%91eli%C4%87ev%20trg%204%2C%20Ni%C5%A1&amp;z=16&amp;hl=sr&amp;output=embed\" style=\"width:100%;height:100%;border:0;display:block\" loading=\"lazy\" referrerpolicy=\"no-referrer-when-downgrade\"><\u002Fiframe>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #E3E8F5;border-radius:22px;padding:32px;background:#FBFCFE;display:flex;flex-direction:column;justify-content:center;height:100%\">\n        <sc-if value=\"{{ sent }}\">\n          <div style=\"display:grid;gap:14px;padding:24px 0;text-align:center\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#1441E8\">Hvala ti!<\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;color:#43506F;line-height:1.6\">Prijava je zabeležena. Javljamo se u toku dana na broj koji si ostavio/la.<\u002Fp>\n            <button type=\"button\" sc-camel-on-click=\"{{ reset }}\" style=\"justify-self:center;margin-top:8px;background:none;border:1px solid #D5DCEF;border-radius:999px;padding:11px 20px;font:inherit;font-size:15px;color:#43506F;cursor:pointer\" style-hover=\"border-color:#1441E8;color:#1441E8\">Pošalji novu prijavu<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:0 0 6px\">Prijava za upis<\u002Fh3>\n            <p style=\"margin:0 0 24px;font-size:15px;color:#5C6A8C\">Popuni i zovemo te sa svim detaljima.<\u002Fp>\n            <div style=\"display:grid;gap:16px\">\n              <label style=\"display:grid;gap:7px\">\n                <span style=\"font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#5C6A8C\">Ime i prezime<\u002Fspan>\n                <input value=\"{{ name }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"Petar Petrović\" style=\"font:inherit;font-size:16px;padding:13px 15px;border:1px solid #D5DCEF;border-radius:12px;background:#fff;color:#0A1533;width:100%\" style-focus=\"outline:none;border-color:#1441E8;box-shadow:0 0 0 3px rgba(20,65,232,0.15)\">\n              <\u002Flabel>\n              <label style=\"display:grid;gap:7px\">\n                <span style=\"font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#5C6A8C\">Telefon<\u002Fspan>\n                <input value=\"{{ phone }}\" sc-camel-on-change=\"{{ onPhone }}\" placeholder=\"06x xxx xxxx\" style=\"font:inherit;font-size:16px;padding:13px 15px;border:1px solid #D5DCEF;border-radius:12px;background:#fff;color:#0A1533;width:100%\" style-focus=\"outline:none;border-color:#1441E8;box-shadow:0 0 0 3px rgba(20,65,232,0.15)\">\n              <\u002Flabel>\n              <div style=\"display:grid;gap:7px\">\n                <span style=\"font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#5C6A8C\">Kategorija<\u002Fspan>\n                <div data-mrow=\"\" style=\"display:flex;gap:10px\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ pickB }}\" style=\"{{ catBStyle }}\">B — auto<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ pickA }}\" style=\"{{ catAStyle }}\">A — motor<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <label style=\"display:grid;gap:7px\">\n                <span style=\"font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#5C6A8C\">Poruka (opciono)<\u002Fspan>\n                <textarea value=\"{{ msg }}\" sc-camel-on-change=\"{{ onMsg }}\" rows=\"3\" placeholder=\"Kada bi ti odgovarali termini?\" style=\"font:inherit;font-size:16px;padding:13px 15px;border:1px solid #D5DCEF;border-radius:12px;background:#fff;color:#0A1533;width:100%;resize:vertical\" style-focus=\"outline:none;border-color:#1441E8;box-shadow:0 0 0 3px rgba(20,65,232,0.15)\"><\u002Ftextarea>\n              <\u002Flabel>\n              <button type=\"button\" sc-camel-on-click=\"{{ submit }}\" style=\"background:#1441E8;color:#fff;border:0;border-radius:999px;padding:16px 24px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 12px 26px -14px rgba(20,65,232,0.9)\" style-hover=\"background:#0A1533\">Pošalji prijavu<\u002Fbutton>\n              <p style=\"margin:0;font-size:13px;color:#8A95B0;text-align:center\">Ili nas pozovi na 018 / 527-793 radnim danima 08–19h.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#0A1533;color:#9FAAC8\">\n    <div data-mrow=\"\" style=\"max-width:1200px;margin:0 auto;padding:48px 24px;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:center\">\n      <div data-mrow=\"\" style=\"display:flex;align-items:center;gap:10px;color:#fff\">\n        <span style=\"width:30px;height:30px;border-radius:9px;background:#1441E8;display:grid;place-items:center;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px\">N<\u002Fspan>\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px\">Auto škola Niprom<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:14px\">Sinđelićev trg 4, 18000 Niš · <a href=\"mailto:niprom.nis@gmail.com\" style=\"color:#A9BCFF\">niprom.nis@gmail.com<\u002Fa><\u002Fdiv>\n      <div style=\"font-size:13px;color:#6B7899\">© 2026 Niprom. Sva prava zadržana.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;priceB&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;95.000&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Cenovnik&quot;}}\">\nclass Component extends DCLogic {\n  state = { name: \"\", phone: \"\", msg: \"\", cat: \"B\", sent: false, wide: true };\n  componentDidMount() {\n    this._sync = () => {\n      const wide = window.innerWidth >= 720;\n      if (wide !== this.state.wide) this.setState({ wide });\n    };\n    this._sync();\n    window.addEventListener(\"resize\", this._sync);\n    this._reveal();\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"resize\", this._sync);\n    if (this._io) this._io.disconnect();\n  }\n  _reveal() {\n    if (this._revealed) return;\n    this._revealed = true;\n    if (!(\"IntersectionObserver\" in window)) return;\n    if (window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches) return;\n    setTimeout(() => {\n      const els = [];\n      document.querySelectorAll(\"section:not(#vrh) > div\").forEach((wrap) => {\n        Array.from(wrap.children).forEach((kid) => {\n          const st = kid.getAttribute(\"style\") || \"\";\n          if (/position:absolute/.test(st)) return;\n          const n = kid.children.length;\n          if (n > 1 && n < 8 && /display:(grid|flex)/.test(st)) els.push(...Array.from(kid.children));\n          else els.push(kid);\n        });\n      });\n      this._io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => {\n          if (e.isIntersecting) {\n            e.target.setAttribute(\"data-rev\", \"1\");\n            this._io.unobserve(e.target);\n          }\n        });\n      }, { threshold: 0.06 });\n      els.forEach((el, i) => {\n        el.style.transitionDelay = (i % 4) * 90 + \"ms\";\n        el.setAttribute(\"data-rev\", \"0\");\n        this._io.observe(el);\n      });\n      setTimeout(() => els.forEach((el) => el.setAttribute(\"data-rev\", \"1\")), 5000);\n    }, 100);\n  }\n  chip(active) {\n    return {\n      flex: \"1\", font: \"inherit\", fontSize: \"15px\", fontWeight: 600, cursor: \"pointer\",\n      padding: \"13px 10px\", borderRadius: \"12px\",\n      border: active ? \"1px solid #1441E8\" : \"1px solid #D5DCEF\",\n      background: active ? \"#1441E8\" : \"#fff\",\n      color: active ? \"#fff\" : \"#43506F\"\n    };\n  }\n  renderVals() {\n    const s = this.state;\n    return {\n      name: s.name, phone: s.phone, msg: s.msg,\n      sent: s.sent, notSent: !s.sent, wide: s.wide,\n      priceB: this.props.priceB ?? \"95.000\",\n      catBStyle: this.chip(s.cat === \"B\"),\n      catAStyle: this.chip(s.cat === \"A\"),\n      onName: (e) => this.setState({ name: e.target.value }),\n      onPhone: (e) => this.setState({ phone: e.target.value }),\n      onMsg: (e) => this.setState({ msg: e.target.value }),\n      pickB: () => this.setState({ cat: \"B\" }),\n      pickA: () => this.setState({ cat: \"A\" }),\n      submit: () => this.setState({ sent: true }),\n      reset: () => this.setState({ sent: false, name: \"\", phone: \"\", msg: \"\" })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
